---
Name: passwordless-login
---
SilverStripe\Core\Injector\Injector:
  # Projects override these to plug in their own rules / delivery.
  XD\PasswordlessLogin\Contract\OtpMemberResolver:
    class: XD\PasswordlessLogin\Resolver\ExistingMemberResolver
  XD\PasswordlessLogin\Contract\OtpDeliveryChannel:
    class: XD\PasswordlessLogin\Delivery\EmailDelivery
  # Register the passwordless authenticator alongside the default (password) one.
  # Authenticators is an Injector property (merged with framework's 'default'),
  # so CMS/admin login (a separate CMSSecurity controller) stays untouched.
  # To show ONLY passwordless on the front-end and ONLY password in admin, also
  # bind Security to ScopedSecurity in the Injector (see README).
  SilverStripe\Security\Security:
    properties:
      Authenticators:
        passwordless: '%$XD\PasswordlessLogin\Authenticator\PasswordlessAuthenticator'

XD\PasswordlessLogin\Service\OtpService:
  enable_code: true         # offer the numeric-code method
  enable_link: true         # offer the login-link method (set false for code-only)
  code_length: 6            # digits; raise for more entropy
  ttl_seconds: 600          # code validity (10 min)
  link_ttl_seconds: 900     # link validity (15 min)
  max_attempts: 5           # wrong code tries before a code is invalidated
  request_cooldown_seconds: 30   # min seconds between requests per e-mail
  ip_max_requests: 10       # max requests per IP per window (0 = off)
  ip_window_seconds: 3600
  bind_to_session: true     # a CODE only works in the browser session that requested it
  # Landing action of the login handler: <Security.login_url>/<authenticator name>/link.
  # Update if you change Security.login_url or the registered authenticator name.
  link_path: 'Security/login/passwordless/link'

XD\PasswordlessLogin\Delivery\EmailDelivery:
  from_email: null          # falls back to SS default sender when null
